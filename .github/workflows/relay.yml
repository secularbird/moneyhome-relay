name: relay

on:
  schedule:
    # Twice an hour and off the top of the hour: GitHub treats schedules as best-effort and delays or skips
    # them under load, and an hourly :20 cron fired only once in ~10 hours. More chances = fresher data.
    - cron: "13,43 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: relay
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feeds
        run: python3 relay.py out
      - name: Publish to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "relay $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - name: Purge the jsDelivr mirror cache
        # jsDelivr caches branch files for hours; the server reads it as a mirror, so refresh it. Best effort.
        run: |
          for f in out/*.json; do
            curl -s -m 20 "https://purge.jsdelivr.net/gh/${{ github.repository }}@data/$(basename "$f")" > /dev/null || true
          done

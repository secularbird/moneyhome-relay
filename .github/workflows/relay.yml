name: relay

on:
  schedule:
    - cron: "20 * * * *"        # hourly; the dashboard's news sync runs at :57
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: relay
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch feeds
        run: python3 relay.py out
      - name: Publish to the data branch
        run: |
          cd out
          git init -q -b data
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "relay $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
